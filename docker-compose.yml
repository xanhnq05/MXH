# ===== MXH Stack — docker-compose =====
# Chạy:  docker-compose up          (foreground, xem logs)
#         docker-compose up -d       (background)
#         docker-compose down        (dừng + xóa container)
#         docker-compose down -v     (xóa cả volume data)
#
# Backend API : http://localhost:5001
# Frontend    : http://localhost:3000
# MongoDB     : mongodb://mongo:27017/mxh
# Redis       : redis://redis:6379

services:
  # ── Database & Cache ──────────────────────────────────────
  mongo:
    image mongo:7
    container_name mxh-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image redis:7-alpine
    container_name mxh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend (Node.js + Express + Socket.IO) ────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name mxh-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      CLIENT_URL: http://localhost:3000
      MONGODB_URI: mongodb://mongo:27017/mxh
      REDIS_URL: redis://redis:6379
      # JWT — ĐỔI TRONG .env TRƯỚC KHI DEPLOY!
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      # Supabase
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-GreenX}
      # Gmail
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # E2EE
      E2EE_SERVER_KEY: ${E2EE_SERVER_KEY:?E2EE_SERVER_KEY is required}
      # Admin
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Frontend (NGINX serving Vite build) ────────────────────
  # Build: docker-compose run --rm frontend-builder
  # Hoặc chạy `npm run build` trong /frontend trước, rồi mới `docker-compose up`
  frontend-builder:
    image node:22-alpine
    container_name mxh-fe-builder
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npm run build"
    environment:
      VITE_API_URL: http://localhost:5001
    profiles:
      - builder  # Chạy riêng: docker-compose --profile builder up
    networks:
      - mxh-net

  nginx:
    image nginx:alpine
    container_name mxh-nginx
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  mxh-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
