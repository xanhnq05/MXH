# MXH Stack - docker-compose (full stack: backend + user + admin)
#
# Chay:  docker-compose up          (foreground, xem logs)
#        docker-compose up -d       (background)
#        docker-compose down        (dung + xoa container)
#        docker-compose down -v     (xoa ca volume data)
#
# Build frontend truoc khi up (can build 1 lan):
#        docker-compose --profile build up builder
#        docker-compose up -d
#
# Ports:
#   Backend API       : http://localhost:5001
#   User Frontend     : http://localhost:3000  (GreenX)
#   Admin Frontend    : http://localhost:3001  (GreenX Admin)
#   MongoDB           : mongodb://mongo:27017/mxh
#   Redis             : redis://redis:6379

services:
  # --- Database & Cache ---
  mongo:
    image: mongo:7
    container_name: mxh-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mxh-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Backend (Node.js + Express + Socket.IO) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mxh-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      # User frontend (GreenX)
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      # Admin frontend (GreenX Admin Console) - tach subdomain
      ADMIN_CLIENT_URL: ${ADMIN_CLIENT_URL:-http://localhost:3001}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/mxh}
      REDIS_URL: redis://redis:6379
      # JWT - DOI TRONG .env TRUOC KHI DEPLOY!
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      E2EE_SERVER_KEY: ${E2EE_SERVER_KEY:?E2EE_SERVER_KEY is required}
      # Supabase Storage (S3-compatible)
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-GreenX}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:-}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:-ap-southeast-1}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:-}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-}
      # Gmail
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Admin allowlist
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ====================================================================
  # USER FRONTEND (GreenX) - port 3000
  # ====================================================================
  frontend-builder:
    image: node:22-alpine
    container_name: mxh-fe-builder
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run build"
    environment:
      # Hardcode /api để request đi qua nginx proxy của frontend container.
      # Không dùng ${VITE_API_URL:-/api} vì shell env có thể override ra URL đầy đủ
      # (vd http://localhost:5001) khiến request bypass nginx → CORS + sai base path.
      VITE_API_URL: /api
    profiles:
      - build
    networks:
      - mxh-net

  frontend:
    image: nginx:alpine
    container_name: mxh-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ====================================================================
  # ADMIN FRONTEND (GreenX Admin Console) - port 3001
  # ====================================================================
  admin-frontend-builder:
    image: node:22-alpine
    container_name: mxh-admin-fe-builder
    working_dir: /app
    volumes:
      - ./admin-frontend:/app
      - admin_frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run build"
    environment:
      VITE_API_URL: /api
      VITE_USER_FRONTEND_URL: ${CLIENT_URL:-http://localhost:3000}
      VITE_APP_NAME: ${VITE_APP_NAME:-GreenX Admin}
    profiles:
      - build
    networks:
      - mxh-net

  admin-frontend:
    image: nginx:alpine
    container_name: mxh-admin-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./admin-frontend/dist:/usr/share/nginx/html:ro
      - ./infra/admin.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mxh-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  mxh-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  # Named volumes de npm ci/build khong can download packages moi lan restart
  frontend_node_modules:
  admin_frontend_node_modules:
